services:
  inngest-sdk:
    build:
      context: .
      dockerfile: Dockerfile.inngest
    volumes:
      - .:/app
    command: python3 inngest_server.py
    env_file:
      - ../../.env
    environment:
      INNGEST_API_BASE_URL: http://inngest:8288
      INNGEST_EVENT_API_BASE_URL: http://inngest:8288
      INNGEST_SERVE_ORIGIN: http://inngest-sdk:8788
      INNGEST_IS_PRODUCTION: "true"
      MINDPLEX_API_URL: http://api:3000/v1/posts
      EDITORIAL_PROVIDER: Bedrock
      PYTHONUNBUFFERED: "1"
    ports:
      - "8788:8788"
    networks:
      - mindplex_api_default

networks:
  mindplex_api_default:
    external: true
